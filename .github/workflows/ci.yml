name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      # Both CLIs must be runnable under node and bun straight from dist.
      - run: node packages/solid-pulse/dist/cli.js --help
      - run: bun packages/solid-pulse/dist/cli.js --help
      - run: node packages/scenario-sim/dist/cli.js --help
      - run: bun packages/scenario-sim/dist/cli.js --help
      # Publish contents must be exactly dist + docs (no tests, no sources).
      - run: cd packages/solid-pulse && npm pack --dry-run 2>&1 | tee /tmp/pack-pulse.txt && ! grep -E "src/|tests/" /tmp/pack-pulse.txt
      - run: cd packages/scenario-sim && npm pack --dry-run 2>&1 | tee /tmp/pack-sim.txt && ! grep -E "src/|tests/" /tmp/pack-sim.txt
      # Consumer smoke: the example app builds for production WITHOUT any devtools code,
      # and its dev server exposes both control planes.
      - run: bash scripts/smoke.sh
