name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits + GitHub releases
      issues: write
      pull-requests: write
      id-token: write # npm provenance via OIDC trusted publishing — no NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 may ship an older npm.
      - run: npm install -g npm@latest && npm --version
      # Both packages are released in lockstep from one semantic-release run
      # (two @semantic-release/npm instances with pkgRoot). Auth is OIDC.
      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
